name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rza-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
          - cc: clang
          - cc: zig cc
            rust_cc: clang
    steps:
      - uses: actions/checkout@v5
      - name: Install C3 0.8.5_1
        shell: bash
        run: |
          mkdir --parents build/toolchain
          curl -fL https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-linux.tar.gz \
            -o build/toolchain/c3.tar.gz
          printf '%s  %s\n' \
            '939135bc6fbe9d67bf3b19c08146b93ab10996718aafff692294ae6c0b3a3f88' \
            build/toolchain/c3.tar.gz | sha256sum --check
          tar -xzf build/toolchain/c3.tar.gz -C build/toolchain
          printf '%s\n' "$PWD/build/toolchain/c3" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/c3/c3c" --version
      - name: Install Zig 0.16.0
        if: matrix.cc == 'zig cc'
        shell: bash
        run: |
          curl -fL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            -o build/toolchain/zig.tar.xz
          printf '%s  %s\n' \
            '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00' \
            build/toolchain/zig.tar.xz | sha256sum --check
          tar -xJf build/toolchain/zig.tar.xz -C build/toolchain
          printf '%s\n' "$PWD/build/toolchain/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/zig-x86_64-linux-0.16.0/zig" version
      - name: Quickstart
        shell: bash
        env:
          CC: ${{ matrix.cc }}
        run: |
          bash build_compiler.sh
          mkdir --parents build
          ./build/bin/rez3asm examples/hello.rza --emit-c -o build/hello.c
          $CC -std=c23 -pedantic -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=undefined -I include/rza -I . \
            build/hello.c -o build/hello.exe
          test "$(./build/hello.exe)" = 41
      - name: Full suite
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          RUST_CC: ${{ matrix.rust_cc }}
        run: bash run_tests.sh
      - name: Address and undefined behavior sanitizers
        if: matrix.cc == 'clang'
        shell: bash
        env:
          CC: clang
          CFLAGS: >-
            -std=c23 -pedantic -Wall -Wextra -Werror
            -fsanitize=address,undefined -fno-sanitize-recover=undefined
            -I include/rza -I .
        run: bash run_tests.sh
      - name: Package and install smoke
        if: matrix.cc == 'gcc'
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          RZA_RELEASE_REQUIRE_CLEAN: "1"
        run: |
          bash release/verify.sh
          bash release/cross_check.sh
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          shopt -s nullglob
          dirs=(build/rza-tests-*)
          if (( ${#dirs[@]} )); then
            printf 'temporary test directories remain: %s\n' "${dirs[*]}" >&2
            exit 1
          fi
          if pgrep -f '[r]ez3asm --lsp'; then
            echo 'LSP process remains' >&2
            exit 1
          fi
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-linux-musl
            qemu: qemu-aarch64
          - arch: riscv64
            target: riscv64-linux-musl
            qemu: qemu-riscv64
    steps:
      - uses: actions/checkout@v5
      - name: Install C3 0.8.5_1
        shell: bash
        run: |
          mkdir --parents build/toolchain
          curl -fL https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-linux.tar.gz \
            -o build/toolchain/c3.tar.gz
          printf '%s  %s\n' \
            '939135bc6fbe9d67bf3b19c08146b93ab10996718aafff692294ae6c0b3a3f88' \
            build/toolchain/c3.tar.gz | sha256sum --check
          tar -xzf build/toolchain/c3.tar.gz -C build/toolchain
          printf '%s\n' "$PWD/build/toolchain/c3" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/c3/c3c" --version
      - name: Install Zig 0.16.0
        shell: bash
        run: |
          curl -fL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            -o build/toolchain/zig.tar.xz
          printf '%s  %s\n' \
            '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00' \
            build/toolchain/zig.tar.xz | sha256sum --check
          tar -xJf build/toolchain/zig.tar.xz -C build/toolchain
          printf '%s\n' "$PWD/build/toolchain/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/zig-x86_64-linux-0.16.0/zig" version
      - name: Install QEMU and ELF tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-user binutils
          "${{ matrix.qemu }}" --version
          readelf --version
      - name: Target suite
        shell: bash
        env:
          CC: zig cc -target ${{ matrix.target }} -static
          RZA_TARGET_ARCH: ${{ matrix.arch }}
          RZA_TARGET_LAUNCHER: ${{ matrix.qemu }}
          RZA_TARGET_LOG: ${{ github.workspace }}/build/target-${{ matrix.arch }}.exec.log
          RZA_TARGET_EXPECTED_PASS: "134"
        run: |
          bash tests/target_runner_cases.sh
          bash run_tests.sh
          executions=$(wc -l < "$RZA_TARGET_LOG")
          test "$executions" -eq 682
          printf 'TARGET %s PASS=134 EXECUTIONS=%s\n' "$RZA_TARGET_ARCH" "$executions"
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          shopt -s nullglob
          dirs=(build/rza-tests-*)
          if (( ${#dirs[@]} )); then
            printf 'temporary test directories remain: %s\n' "${dirs[*]}" >&2
            exit 1
          fi
          if pgrep -f '[r]ez3asm --lsp'; then
            echo 'LSP process remains' >&2
            exit 1
          fi
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install C3 0.8.5_1
        shell: bash
        run: |
          mkdir --parents build/toolchain
          curl.exe -fL https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-windows.zip \
            -o build/toolchain/c3.zip
          printf '%s  %s\n' \
            '8cfdb48d8f9f1bc0d320a3e941c98ccdb8c8c0194564b1a7dd9fd2ab24292081' \
            build/toolchain/c3.zip | sha256sum --check
          unzip -q build/toolchain/c3.zip -d build/toolchain
          c3c_dir=$(dirname "$(find build/toolchain -name c3c.exe -print -quit)")
          test -n "$c3c_dir"
          printf '%s\n' "$c3c_dir" >> "$GITHUB_PATH"
          "$c3c_dir/c3c.exe" --version
      - name: Install Zig 0.16.0
        shell: bash
        run: |
          curl.exe -fL https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip \
            -o build/toolchain/zig.zip
          printf '%s  %s\n' \
            '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e' \
            build/toolchain/zig.zip | sha256sum --check
          unzip -q build/toolchain/zig.zip -d build/toolchain
          printf '%s\n' "$PWD/build/toolchain/zig-x86_64-windows-0.16.0" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/zig-x86_64-windows-0.16.0/zig.exe" version
      - name: Quickstart
        shell: bash
        run: |
          bash build_compiler.sh
          mkdir --parents build
          ./build/bin/rez3asm.exe examples/hello.rza --emit-c -o build/hello.c
          zig version
          zig cc -v -std=c23 -pedantic -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=undefined -I include/rza -I . \
            build/hello.c -o build/hello.exe
          test "$(./build/hello.exe)" = 41
      - name: Full suite
        shell: bash
        env:
          CC: zig cc
        run: bash run_tests.sh
      - name: Package and install smoke
        shell: bash
        env:
          CC: zig cc
          RZA_RELEASE_REQUIRE_CLEAN: "1"
        run: |
          bash release/verify.sh
          bash release/cross_check.sh
      - name: Upload failed package diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-diagnostics-windows-${{ github.run_id }}
          path: |
            build/release-verify/**
            build/release-cross/**
          if-no-files-found: warn
          retention-days: 1
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          shopt -s nullglob
          dirs=(build/rza-tests-*)
          if (( ${#dirs[@]} )); then
            printf 'temporary test directories remain: %s\n' "${dirs[*]}" >&2
            exit 1
          fi
          if tasklist //FI "IMAGENAME eq rez3asm.exe" | grep -q 'rez3asm.exe'; then
            echo 'LSP process remains' >&2
            exit 1
          fi

  msvc:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install C3 0.8.5_1
        shell: bash
        run: |
          mkdir --parents build/toolchain
          curl.exe -fL https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-windows.zip \
            -o build/toolchain/c3.zip
          printf '%s  %s\n' \
            '8cfdb48d8f9f1bc0d320a3e941c98ccdb8c8c0194564b1a7dd9fd2ab24292081' \
            build/toolchain/c3.zip | sha256sum --check
          unzip -q build/toolchain/c3.zip -d build/toolchain
          c3c_dir=$(dirname "$(find build/toolchain -name c3c.exe -print -quit)")
          test -n "$c3c_dir"
          printf '%s\n' "$c3c_dir" >> "$GITHUB_PATH"
          "$c3c_dir/c3c.exe" --version
      - name: Full suite and packaging with MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -property installationPath
          if (-not $installation) { throw "Visual Studio with MSVC was not found" }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          & cmd.exe /d /s /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "vcvars64 failed: $LASTEXITCODE" }
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw "MSVC target is not x64" }
          & cl
          if ($LASTEXITCODE -ne 0) { throw "cl.exe failed: $LASTEXITCODE" }
          $env:CC = 'cl'
          & bash --noprofile --norc -o pipefail -c 'bash run_tests.sh | tee build/msvc-suite.log'
          if ($LASTEXITCODE -ne 0) { throw "MSVC suite failed: $LASTEXITCODE" }
          $env:RZA_RELEASE_REQUIRE_CLEAN = '1'
          & bash --noprofile --norc -o pipefail release/verify.sh
          if ($LASTEXITCODE -ne 0) { throw "MSVC package verify failed: $LASTEXITCODE" }
          & bash --noprofile --norc -o pipefail release/cross_check.sh
          if ($LASTEXITCODE -ne 0) { throw "MSVC cross-check failed: $LASTEXITCODE" }
      - name: Upload failed MSVC diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-diagnostics-${{ github.run_id }}
          path: |
            build/msvc-suite.log
            build/release-verify/**
            build/release-cross/**
          if-no-files-found: warn
          retention-days: 1
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          shopt -s nullglob
          dirs=(build/rza-tests-*)
          if (( ${#dirs[@]} )); then
            printf 'temporary test directories remain: %s\n' "${dirs[*]}" >&2
            exit 1
          fi
          if tasklist //FI "IMAGENAME eq rez3asm.exe" | grep -q 'rez3asm.exe'; then
            echo 'LSP process remains' >&2
            exit 1
          fi

  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Read extension revision
        id: extension_revision
        shell: bash
        run: |
          printf 'sha=%s\n' \
            "$(git ls-tree HEAD editors/vscode | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Checkout extension
        uses: actions/checkout@v5
        with:
          repository: wtorso/rza-vscode
          ref: ${{ steps.extension_revision.outputs.sha }}
          path: editors/vscode
      - name: Install C3 0.8.5_1
        shell: bash
        run: |
          mkdir --parents build/toolchain
          curl -fL https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-linux.tar.gz \
            -o build/toolchain/c3.tar.gz
          printf '%s  %s\n' \
            '939135bc6fbe9d67bf3b19c08146b93ab10996718aafff692294ae6c0b3a3f88' \
            build/toolchain/c3.tar.gz | sha256sum --check
          tar -xzf build/toolchain/c3.tar.gz -C build/toolchain
          printf '%s\n' "$PWD/build/toolchain/c3" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/c3/c3c" --version
      - name: Install Node 22.14.0
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - name: Build compiler
        shell: bash
        run: bash build_compiler.sh
      - name: Install extension dependencies
        shell: bash
        run: npm ci --prefix editors/vscode
      - name: Audit production dependencies
        shell: bash
        run: npm audit --omit=dev --prefix editors/vscode
      - name: Unit tests
        shell: bash
        run: npm test --prefix editors/vscode
      - name: Package tests
        shell: bash
        run: npm run test:package --prefix editors/vscode
      - name: Extension Host tests
        shell: bash
        run: xvfb-run -a npm run test:integration --prefix editors/vscode
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          if pgrep -f '[r]ez3asm --lsp'; then
            echo 'LSP process remains' >&2
            exit 1
          fi
