name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Test group to run
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - sanitize
          - cross
          - windows
          - msvc
          - packages
          - editors

permissions:
  contents: read

concurrency:
  group: rza-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'all' || inputs.suite == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
          - cc: clang
          - cc: zig cc
            rust_cc: clang
    steps:
      - uses: actions/checkout@v5
      - name: Install C3 0.8.5_1
        shell: bash
        run: |
          mkdir --parents build/toolchain
          curl -fL https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-linux.tar.gz \
            -o build/toolchain/c3.tar.gz
          printf '%s  %s\n' \
            '939135bc6fbe9d67bf3b19c08146b93ab10996718aafff692294ae6c0b3a3f88' \
            build/toolchain/c3.tar.gz | sha256sum --check
          tar -xzf build/toolchain/c3.tar.gz -C build/toolchain
          printf '%s\n' "$PWD/build/toolchain/c3" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/c3/c3c" --version
      - name: Install Zig 0.17.1
        if: matrix.cc == 'zig cc'
        shell: bash
        run: |
          curl -fL https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz \
            -o build/toolchain/zig.tar.xz
          printf '%s  %s\n' \
            '3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a' \
            build/toolchain/zig.tar.xz | sha256sum --check
          tar -xJf build/toolchain/zig.tar.xz -C build/toolchain
          printf '%s\n' "$PWD/build/toolchain/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/zig-x86_64-linux-0.17.1/zig" version
      - name: Quickstart
        shell: bash
        env:
          CC: ${{ matrix.cc }}
        run: |
          bash build_compiler.sh
          mkdir --parents build
          ./build/bin/rez3asm examples/hello.rza --emit-c -o build/hello.c
          $CC -std=c23 -pedantic -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=undefined -I include/rza -I . \
            build/hello.c -o build/hello.exe
          test "$(./build/hello.exe)" = 41
      - name: Strict FP toolchain probe
        shell: bash
        env:
          CC: ${{ matrix.cc }}
        run: bash tests/support/fp_toolchain_probe.sh
      - name: Full suite
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          RUST_CC: ${{ matrix.rust_cc }}
        run: bash run_tests.sh
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          shopt -s nullglob
          dirs=(build/rza-tests-*)
          if (( ${#dirs[@]} )); then
            printf 'temporary test directories remain: %s\n' "${dirs[*]}" >&2
            exit 1
          fi
          if pgrep -f '[r]ez3asm --lsp'; then
            echo 'LSP process remains' >&2
            exit 1
          fi

  sanitize:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'all' || inputs.suite == 'sanitize'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install C3 0.8.5_1
        shell: bash
        run: |
          mkdir --parents build/toolchain
          curl -fL https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-linux.tar.gz \
            -o build/toolchain/c3.tar.gz
          printf '%s  %s\n' \
            '939135bc6fbe9d67bf3b19c08146b93ab10996718aafff692294ae6c0b3a3f88' \
            build/toolchain/c3.tar.gz | sha256sum --check
          tar -xzf build/toolchain/c3.tar.gz -C build/toolchain
          printf '%s\n' "$PWD/build/toolchain/c3" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/c3/c3c" --version
      - name: Address and undefined behavior sanitizers
        shell: bash
        env:
          CC: clang
          CFLAGS: >-
            -std=c23 -pedantic -Wall -Wextra -Werror
            -fno-fast-math -ffp-contract=off -fexcess-precision=standard
            -fsanitize=address,undefined -fno-sanitize-recover=undefined
            -I include/rza -I .
        run: bash run_tests.sh
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          if pgrep -f '[r]ez3asm --lsp'; then
            echo 'LSP process remains' >&2
            exit 1
          fi

  linux-package:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'all' || inputs.suite == 'packages'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install C3 0.8.5_1
        shell: bash
        run: |
          mkdir --parents build/toolchain
          curl -fL https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-linux.tar.gz \
            -o build/toolchain/c3.tar.gz
          printf '%s  %s\n' \
            '939135bc6fbe9d67bf3b19c08146b93ab10996718aafff692294ae6c0b3a3f88' \
            build/toolchain/c3.tar.gz | sha256sum --check
          tar -xzf build/toolchain/c3.tar.gz -C build/toolchain
          printf '%s\n' "$PWD/build/toolchain/c3" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/c3/c3c" --version
      - name: Package and install smoke
        shell: bash
        env:
          CC: gcc
          RZA_RELEASE_REQUIRE_CLEAN: "1"
        run: |
          bash release/parallel_check.sh
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          shopt -s nullglob
          dirs=(build/rza-tests-*)
          if (( ${#dirs[@]} )); then
            printf 'temporary test directories remain: %s\n' "${dirs[*]}" >&2
            exit 1
          fi
          if pgrep -f '[r]ez3asm --lsp'; then
            echo 'LSP process remains' >&2
            exit 1
          fi
  cross:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'all' || inputs.suite == 'cross'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-linux-musl
            qemu: qemu-aarch64
          - arch: riscv64
            target: riscv64-linux-musl
            qemu: qemu-riscv64
    steps:
      - uses: actions/checkout@v5
      - name: Install C3 0.8.5_1
        shell: bash
        run: |
          mkdir --parents build/toolchain
          curl -fL https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-linux.tar.gz \
            -o build/toolchain/c3.tar.gz
          printf '%s  %s\n' \
            '939135bc6fbe9d67bf3b19c08146b93ab10996718aafff692294ae6c0b3a3f88' \
            build/toolchain/c3.tar.gz | sha256sum --check
          tar -xzf build/toolchain/c3.tar.gz -C build/toolchain
          printf '%s\n' "$PWD/build/toolchain/c3" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/c3/c3c" --version
      - name: Install Zig 0.17.1
        shell: bash
        run: |
          curl -fL https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz \
            -o build/toolchain/zig.tar.xz
          printf '%s  %s\n' \
            '3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a' \
            build/toolchain/zig.tar.xz | sha256sum --check
          tar -xJf build/toolchain/zig.tar.xz -C build/toolchain
          printf '%s\n' "$PWD/build/toolchain/zig-x86_64-linux-0.17.1" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/zig-x86_64-linux-0.17.1/zig" version
      - name: Install QEMU and ELF tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-user binutils gawk
          "${{ matrix.qemu }}" --version
          readelf --version
      - name: Strict FP toolchain probe
        shell: bash
        env:
          CC: zig cc -target ${{ matrix.target }} -static
          RZA_TARGET_ARCH: ${{ matrix.arch }}
          RZA_TARGET_LAUNCHER: ${{ matrix.qemu }}
          RZA_TARGET_LOG: ${{ github.workspace }}/build/fp-${{ matrix.arch }}.exec.log
        run: bash tests/support/fp_toolchain_probe.sh 2>&1 | tee build/target-probe.log
      - name: Target suite
        shell: bash
        env:
          CC: zig cc -target ${{ matrix.target }} -static
          RZA_TARGET_ARCH: ${{ matrix.arch }}
          RZA_TARGET_LAUNCHER: ${{ matrix.qemu }}
          RZA_TARGET_LOG: ${{ github.workspace }}/build/target-${{ matrix.arch }}.exec.log
          RZA_TARGET_EXPECTED_PASS: "212"
        run: |
          bash tests/support/target_runner_cases.sh
          bash run_tests.sh 2>&1 | tee build/target-suite.log
          executions=$(wc -l < "$RZA_TARGET_LOG")
          test "$executions" -eq 1540
          printf 'TARGET %s PASS=212 EXECUTIONS=%s\n' "$RZA_TARGET_ARCH" "$executions"
      - name: Upload failed target diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: target-diagnostics-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            build/target-probe.log
            build/target-suite.log
            build/fp-toolchain-probe/**
            build/fp-${{ matrix.arch }}.exec.log
            build/target-${{ matrix.arch }}.exec.log
          if-no-files-found: warn
          retention-days: 1
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          shopt -s nullglob
          dirs=(build/rza-tests-*)
          if (( ${#dirs[@]} )); then
            printf 'temporary test directories remain: %s\n' "${dirs[*]}" >&2
            exit 1
          fi
          if pgrep -f '[r]ez3asm --lsp'; then
            echo 'LSP process remains' >&2
            exit 1
          fi
  windows:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'all' || inputs.suite == 'windows'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            expected: "323"
          - group: execution
            expected: "2"
          - group: numeric8
            expected: "1"
          - group: numeric16
            expected: "1"
          - group: numeric32
            expected: "1"
          - group: numeric64
            expected: "1"
          - group: float32
            expected: "1"
          - group: float64
            expected: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install C3 0.8.5_1
        shell: bash
        run: |
          mkdir --parents build/toolchain
          curl.exe -fL https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-windows.zip \
            -o build/toolchain/c3.zip
          printf '%s  %s\n' \
            '8cfdb48d8f9f1bc0d320a3e941c98ccdb8c8c0194564b1a7dd9fd2ab24292081' \
            build/toolchain/c3.zip | sha256sum --check
          unzip -q build/toolchain/c3.zip -d build/toolchain
          c3c_dir=$(dirname "$(find build/toolchain -name c3c.exe -print -quit)")
          test -n "$c3c_dir"
          printf '%s\n' "$c3c_dir" >> "$GITHUB_PATH"
          "$c3c_dir/c3c.exe" --version
      - name: Install Zig 0.17.1
        shell: bash
        run: |
          curl.exe -fL https://ziglang.org/download/0.17.1/zig-x86_64-windows-0.17.1.zip \
            -o build/toolchain/zig.zip
          printf '%s  %s\n' \
            'b03f477a1943673e02aca0f570e8030dffd536ce1f45cbc4d3326ec31159562e' \
            build/toolchain/zig.zip | sha256sum --check
          unzip -q build/toolchain/zig.zip -d build/toolchain
          printf '%s\n' "$PWD/build/toolchain/zig-x86_64-windows-0.17.1" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/zig-x86_64-windows-0.17.1/zig.exe" version
      - name: Quickstart
        shell: bash
        run: |
          bash build_compiler.sh
          mkdir --parents build
          ./build/bin/rez3asm.exe examples/hello.rza --emit-c -o build/hello.c
          zig version
          zig cc -v -std=c23 -pedantic -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=undefined -I include/rza -I . \
            build/hello.c -o build/hello.exe
          test "$(./build/hello.exe)" = 41
      - name: Strict FP toolchain probe
        shell: bash
        env:
          CC: zig cc
        run: bash tests/support/fp_toolchain_probe.sh 2>&1 | tee build/windows-probe.log
      - name: Full suite (${{ matrix.group }})
        shell: bash
        env:
          CC: zig cc
          RZA_TEST_GROUP: ${{ matrix.group }}
          RZA_EXPECTED_PASS: ${{ matrix.expected }}
        run: bash run_tests.sh
      - name: Upload failed probe diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: probe-diagnostics-windows-${{ matrix.group }}-${{ github.run_id }}
          path: |
            build/windows-probe.log
            build/fp-toolchain-probe/**
          if-no-files-found: warn
          retention-days: 1
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          shopt -s nullglob
          dirs=(build/rza-tests-*)
          if (( ${#dirs[@]} )); then
            printf 'temporary test directories remain: %s\n' "${dirs[*]}" >&2
            exit 1
          fi
          if tasklist //FI "IMAGENAME eq rez3asm.exe" | grep -q 'rez3asm.exe'; then
            echo 'LSP process remains' >&2
            exit 1
          fi

  windows-package:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'all' || inputs.suite == 'packages'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: verify
            script: verify.sh
          - check: cross
            script: cross_check.sh
    steps:
      - uses: actions/checkout@v5
      - name: Install C3 0.8.5_1
        shell: bash
        run: |
          mkdir --parents build/toolchain
          curl.exe -fL https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-windows.zip \
            -o build/toolchain/c3.zip
          printf '%s  %s\n' \
            '8cfdb48d8f9f1bc0d320a3e941c98ccdb8c8c0194564b1a7dd9fd2ab24292081' \
            build/toolchain/c3.zip | sha256sum --check
          unzip -q build/toolchain/c3.zip -d build/toolchain
          c3c_dir=$(dirname "$(find build/toolchain -name c3c.exe -print -quit)")
          test -n "$c3c_dir"
          printf '%s\n' "$c3c_dir" >> "$GITHUB_PATH"
          "$c3c_dir/c3c.exe" --version
      - name: Install Zig 0.17.1
        shell: bash
        run: |
          curl.exe -fL https://ziglang.org/download/0.17.1/zig-x86_64-windows-0.17.1.zip \
            -o build/toolchain/zig.zip
          printf '%s  %s\n' \
            'b03f477a1943673e02aca0f570e8030dffd536ce1f45cbc4d3326ec31159562e' \
            build/toolchain/zig.zip | sha256sum --check
          unzip -q build/toolchain/zig.zip -d build/toolchain
          printf '%s\n' "$PWD/build/toolchain/zig-x86_64-windows-0.17.1" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/zig-x86_64-windows-0.17.1/zig.exe" version
      - name: Package and install smoke
        shell: bash
        env:
          CC: zig cc
          RZA_RELEASE_REQUIRE_CLEAN: "1"
        run: bash "release/${{ matrix.script }}"
      - name: Upload failed package diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-diagnostics-windows-${{ matrix.check }}-${{ github.run_id }}
          path: |
            build/release-verify/**
            build/release-cross/**
          if-no-files-found: warn
          retention-days: 1
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          shopt -s nullglob
          dirs=(build/rza-tests-*)
          if (( ${#dirs[@]} )); then
            printf 'temporary test directories remain: %s\n' "${dirs[*]}" >&2
            exit 1
          fi
          if tasklist //FI "IMAGENAME eq rez3asm.exe" | grep -q 'rez3asm.exe'; then
            echo 'LSP process remains' >&2
            exit 1
          fi

  msvc:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'all' || inputs.suite == 'msvc'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            expected: "324"
          - group: execution
            expected: "2"
          - group: numeric8
            expected: "1"
          - group: numeric16
            expected: "1"
          - group: numeric32
            expected: "1"
          - group: numeric64
            expected: "1"
          - group: float32
            expected: "1"
          - group: float64
            expected: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install C3 0.8.5_1
        shell: bash
        run: |
          mkdir --parents build/toolchain
          curl.exe -fL https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-windows.zip \
            -o build/toolchain/c3.zip
          printf '%s  %s\n' \
            '8cfdb48d8f9f1bc0d320a3e941c98ccdb8c8c0194564b1a7dd9fd2ab24292081' \
            build/toolchain/c3.zip | sha256sum --check
          unzip -q build/toolchain/c3.zip -d build/toolchain
          c3c_dir=$(dirname "$(find build/toolchain -name c3c.exe -print -quit)")
          test -n "$c3c_dir"
          printf '%s\n' "$c3c_dir" >> "$GITHUB_PATH"
          "$c3c_dir/c3c.exe" --version
      - name: Full suite with MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -property installationPath
          if (-not $installation) { throw "Visual Studio with MSVC was not found" }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          & cmd.exe /d /s /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "vcvars64 failed: $LASTEXITCODE" }
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw "MSVC target is not x64" }
          & cl
          if ($LASTEXITCODE -ne 0) { throw "cl.exe failed: $LASTEXITCODE" }
          $env:RZA_TEST_GROUP = '${{ matrix.group }}'
          $env:RZA_EXPECTED_PASS = '${{ matrix.expected }}'
          $env:CC = 'cl'
          & bash --noprofile --norc -o pipefail `
            -c 'bash tests/support/fp_toolchain_probe.sh 2>&1 | tee build/msvc-probe.log'
          if ($LASTEXITCODE -ne 0) { throw "Strict FP probe failed: $LASTEXITCODE" }
          & bash --noprofile --norc -o pipefail -c 'bash run_tests.sh | tee build/msvc-suite.log'
          if ($LASTEXITCODE -ne 0) { throw "MSVC suite failed: $LASTEXITCODE" }
      - name: Upload failed MSVC diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-diagnostics-${{ matrix.group }}-${{ github.run_id }}
          path: |
            build/msvc-suite.log
            build/msvc-probe.log
            build/fp-toolchain-probe/**
          if-no-files-found: warn
          retention-days: 1
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          shopt -s nullglob
          dirs=(build/rza-tests-*)
          if (( ${#dirs[@]} )); then
            printf 'temporary test directories remain: %s\n' "${dirs[*]}" >&2
            exit 1
          fi
          if tasklist //FI "IMAGENAME eq rez3asm.exe" | grep -q 'rez3asm.exe'; then
            echo 'LSP process remains' >&2
            exit 1
          fi

  msvc-package:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'all' || inputs.suite == 'packages'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install C3 0.8.5_1
        shell: bash
        run: |
          mkdir --parents build/toolchain
          curl.exe -fL https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-windows.zip \
            -o build/toolchain/c3.zip
          printf '%s  %s\n' \
            '8cfdb48d8f9f1bc0d320a3e941c98ccdb8c8c0194564b1a7dd9fd2ab24292081' \
            build/toolchain/c3.zip | sha256sum --check
          unzip -q build/toolchain/c3.zip -d build/toolchain
          c3c_dir=$(dirname "$(find build/toolchain -name c3c.exe -print -quit)")
          test -n "$c3c_dir"
          printf '%s\n' "$c3c_dir" >> "$GITHUB_PATH"
          "$c3c_dir/c3c.exe" --version
      - name: Release and cross-check with MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -property installationPath
          if (-not $installation) { throw "Visual Studio with MSVC was not found" }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          & cmd.exe /d /s /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "vcvars64 failed: $LASTEXITCODE" }
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw "MSVC target is not x64" }
          & cl
          if ($LASTEXITCODE -ne 0) { throw "cl.exe failed: $LASTEXITCODE" }
          $env:CC = 'cl'
          $env:RZA_RELEASE_REQUIRE_CLEAN = '1'
          & bash --noprofile --norc -o pipefail release/parallel_check.sh
          if ($LASTEXITCODE -ne 0) { throw "MSVC parallel package checks failed: $LASTEXITCODE" }
      - name: Upload failed package diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-package-diagnostics-${{ github.run_id }}
          path: |
            build/release-verify/**
            build/release-cross/**
          if-no-files-found: warn
          retention-days: 1
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          shopt -s nullglob
          dirs=(build/rza-tests-*)
          if (( ${#dirs[@]} )); then
            printf 'temporary test directories remain: %s\n' "${dirs[*]}" >&2
            exit 1
          fi
          if tasklist //FI "IMAGENAME eq rez3asm.exe" | grep -q 'rez3asm.exe'; then
            echo 'LSP process remains' >&2
            exit 1
          fi

  lightweight-editors:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'all' || inputs.suite == 'editors'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Emacs and Vim
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends emacs-nox vim-nox
          emacs --version
          vim --version
      - name: Test lightweight editor support
        shell: bash
        run: bash editors/tests/run.sh
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  nvim:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'all' || inputs.suite == 'editors'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Read Neovim revision
        id: nvim_revision
        shell: bash
        run: |
          printf 'sha=%s\n' \
            "$(git ls-tree HEAD editors/nvim | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Checkout Neovim client
        uses: actions/checkout@v5
        with:
          repository: wtorso/rza-nvim
          ref: ${{ steps.nvim_revision.outputs.sha }}
          path: editors/nvim
      - name: Install C3 0.8.5_1
        shell: bash
        run: |
          mkdir --parents build/toolchain
          curl -fL https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-linux.tar.gz \
            -o build/toolchain/c3.tar.gz
          printf '%s  %s\n' \
            '939135bc6fbe9d67bf3b19c08146b93ab10996718aafff692294ae6c0b3a3f88' \
            build/toolchain/c3.tar.gz | sha256sum --check
          tar -xzf build/toolchain/c3.tar.gz -C build/toolchain
          printf '%s\n' "$PWD/build/toolchain/c3" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/c3/c3c" --version
      - name: Install Neovim
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends neovim
          nvim --version
      - name: Build compiler
        shell: bash
        run: bash build_compiler.sh
      - name: Syntax tests without a compiler
        shell: bash
        run: bash editors/nvim/test/run.sh
      - name: Syntax and LSP integration tests
        shell: bash
        run: RZA_COMPILER="$PWD/build/bin/rez3asm" bash editors/nvim/test/run.sh
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          if pgrep -f '[r]ez3asm --lsp'; then
            echo 'LSP process remains' >&2
            exit 1
          fi

  editor:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.suite == 'all' || inputs.suite == 'editors'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Read extension revision
        id: extension_revision
        shell: bash
        run: |
          printf 'sha=%s\n' \
            "$(git ls-tree HEAD editors/vscode | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - name: Checkout extension
        uses: actions/checkout@v5
        with:
          repository: wtorso/rza-vscode
          ref: ${{ steps.extension_revision.outputs.sha }}
          path: editors/vscode
      - name: Install C3 0.8.5_1
        shell: bash
        run: |
          mkdir --parents build/toolchain
          curl -fL https://github.com/c3lang/c3c/releases/download/v0.8.5_1/c3-linux.tar.gz \
            -o build/toolchain/c3.tar.gz
          printf '%s  %s\n' \
            '939135bc6fbe9d67bf3b19c08146b93ab10996718aafff692294ae6c0b3a3f88' \
            build/toolchain/c3.tar.gz | sha256sum --check
          tar -xzf build/toolchain/c3.tar.gz -C build/toolchain
          printf '%s\n' "$PWD/build/toolchain/c3" >> "$GITHUB_PATH"
          "$PWD/build/toolchain/c3/c3c" --version
      - name: Install Node 22.14.0
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
      - name: Build compiler
        shell: bash
        run: bash build_compiler.sh
      - name: Install extension dependencies
        shell: bash
        run: npm ci --prefix editors/vscode
      - name: Audit production dependencies
        shell: bash
        run: npm audit --omit=dev --prefix editors/vscode
      - name: Unit tests
        shell: bash
        run: npm test --prefix editors/vscode
      - name: Package tests
        shell: bash
        run: npm run test:package --prefix editors/vscode
      - name: Extension Host tests
        shell: bash
        run: xvfb-run -a npm run test:integration --prefix editors/vscode
      - name: Hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          if pgrep -f '[r]ez3asm --lsp'; then
            echo 'LSP process remains' >&2
            exit 1
          fi
